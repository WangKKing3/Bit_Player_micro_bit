# Configuration for BitPlayer Joystick Reader with Bluetooth
# Zephyr SDK v2.5.1

# Enable console and UART for serial output
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Enable ADC support
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_INIT_PRIORITY=80

# Enable GPIO for buttons
CONFIG_GPIO=y

# System configuration
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# Increase heap size for Bluetooth
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ====================================
# Bluetooth Configuration
# ====================================

# Enable Bluetooth
CONFIG_BT=y

# Enable Bluetooth peripheral role (advertiser)
CONFIG_BT_PERIPHERAL=y

# Bluetooth device name (will appear when scanning)
CONFIG_BT_DEVICE_NAME="BitPlayer_Joy"

# Maximum number of simultaneous connections
CONFIG_BT_MAX_CONN=1

# Enable GATT (Generic Attribute Profile)
CONFIG_BT_GATT_DYNAMIC_DB=y

# Bluetooth buffer configuration
CONFIG_BT_L2CAP_TX_BUF_COUNT=4
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=70
CONFIG_BT_BUF_ACL_TX_SIZE=27

# Enable Bluetooth debugging (optional, kan kommenteres ut)
# CONFIG_BT_DEBUG_LOG=y
# CONFIG_BT_DEBUG_GATT=y
# CONFIG_BT_DEBUG_HCI_CORE=y

# ATT (Attribute Protocol) settings
CONFIG_BT_ATT_PREPARE_COUNT=2

# GATT settings for notifications
CONFIG_BT_GATT_CLIENT=y

# Enable Bluetooth privacy (optional)
# CONFIG_BT_PRIVACY=y

# Connection parameters
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=42