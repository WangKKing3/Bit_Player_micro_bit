# Configuration for BitPlayer Joystick Reader

# Enable console and UART for serial output
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Enable ADC support
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y

CONFIG_ADC_ASYNC=y
CONFIG_ADC_INIT_PRIORITY=80

# Enable GPIO if needed
CONFIG_GPIO=y

# System configuration
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# Optional: Increase heap size if needed
CONFIG_HEAP_MEM_POOL_SIZE=2048